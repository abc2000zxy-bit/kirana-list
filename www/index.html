<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kirana & Sabzi List</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1f2937; padding-bottom: 90px; }
    header { background: #15803d; color: white; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { margin: 0; font-size: 19px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: 0.92; }
    .lang-bar { display: flex; background: rgba(255,255,255,0.2); border-radius: 8px; padding: 2px; }
    .lang-btn { border: none; background: transparent; color: white; padding: 5px 8px; font-size: 12px; font-weight: 700; border-radius: 6px; }
    .lang-btn.active { background: white; color: #15803d; }
    .tabs { display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .tab { padding: 8px 14px; border-radius: 20px; border: 1px solid #d1d5db; background: #f9fafb; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .tab.active { background: #15803d; color: white; border-color: #15803d; }
    .add-box { display: flex; gap: 8px; padding: 12px 14px; }
    .add-box input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; }
    .add-box button { background: #15803d; color: white; border: none; border-radius: 10px; padding: 0 16px; font-weight: 600; font-size: 15px; }
    .list { padding: 0 14px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: white; padding: 12px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; }
    .card.selected { border-color: #16a34a; background: #f0fdf4; }
    .item-info { flex: 1; }
    .item-name { font-size: 16px; font-weight: 600; }
    .item-sub { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    select { padding: 6px 8px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; background: white; }
    .check-btn { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #16a34a; background: white; color: #16a34a; font-weight: bold; font-size: 16px; }
    .card.selected .check-btn { background: #16a34a; color: white; }
    .del-btn { border: none; background: #fee2e2; color: #dc2626; border-radius: 8px; padding: 6px 8px; font-size: 14px; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px 14px; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
    .clear-btn { padding: 12px 14px; border-radius: 10px; border: 1px solid #ef4444; color: #ef4444; background: white; font-weight: 600; }
    .wa-btn { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #25D366; color: white; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
<header>
  <div class="header-top">
    <h1 id="appTitle">🛒 Kirana & Sabzi List</h1>
    <div class="lang-bar">
      <button type="button" class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
      <button type="button" class="lang-btn" id="btn-hi" onclick="setLang('hi')">हिंदी</button>
      <button type="button" class="lang-btn" id="btn-pa" onclick="setLang('pa')">ਪੰਜਾਬੀ</button>
    </div>
  </div>
  <p id="appSub">Tap items to add & send on WhatsApp</p>
</header>
<div class="tabs" id="tabs"></div>
<div class="add-box">
  <input type="text" id="customItem" placeholder="Add custom item..." />
  <button type="button" id="addBtn" onclick="addCustom()">+ Add</button>
</div>
<div class="list" id="itemList"></div>
<div class="bottom-bar">
  <button type="button" class="clear-btn" id="clearBtn" onclick="clearAll()">Uncheck All</button>
  <button type="button" class="wa-btn" onclick="sendWhatsApp()"><span id="waLabel">Send to WhatsApp</span> (<span id="count">0</span>)</button>
</div>
<script>
var ui = {
  en: { title: "🛒 Kirana & Sabzi List", sub: "Tap items to add & send on WhatsApp", ph: "Add custom item...", add: "+ Add", clr: "Uncheck All", wa: "Send to WhatsApp", emp: "Select at least 1 item!", del: "Delete this item?", hdr: "*🛒 Ghar Ki List:*", cats: { All: "All", Selected: "Selected", Ration: "Ration", Masale: "Masale", Sabzi: "Sabzi", Dairy: "Dairy" } },
  hi: { title: "🛒 राशन और सब्ज़ी लिस्ट", sub: "सामान चुनें और व्हाट्सएप पर भेजें", ph: "नया सामान लिखें...", add: "+ जोड़ें", clr: "सब हटाएं", wa: "व्हाट्सएप पर भेजें", emp: "कम से कम 1 सामान चुनें!", del: "सामान हटाएं?", hdr: "*🛒 घर का सामान:*", cats: { All: "सभी", Selected: "चुने हुए", Ration: "राशन", Masale: "मसाले", Sabzi: "सब्ज़ी", Dairy: "डेयरी" } },
  pa: { title: "🛒 ਰਾਸ਼ਨ ਤੇ ਸਬਜ਼ੀ ਲਿਸਟ", sub: "ਸਮਾਨ ਚੁਣੋ ਤੇ ਵਟਸਐਪ ਤੇ ਭੇਜੋ", ph: "ਨਵਾਂ ਸਮਾਨ ਲਿਖੋ...", add: "+ ਜੋੜੋ", clr: "ਸਭ ਅਣ-ਚੁਣੋ", wa: "ਵਟਸਐਪ ਤੇ ਭੇਜੋ", emp: "ਘੱਟੋ-ਘੱਟ 1 ਸਮਾਨ ਚੁਣੋ!", del: "ਸਮਾਨ ਹਟਾਉਣਾ ਹੈ?", hdr: "*🛒 ਘਰ ਦੇ ਸਮਾਨ ਦੀ ਲਿਸਟ:*", cats: { All: "ਸਾਰਾ", Selected: "ਚੁਣਿਆ", Ration: "ਰਾਸ਼ਨ", Masale: "ਮਸਾਲੇ", Sabzi: "ਸਬਜ਼ੀ", Dairy: "ਡੇਅਰੀ" } }
};
var base = [
  { id: 1, cat: "Ration", en: "Atta (Wheat Flour)", hi: "आटा", pa: "ਆਟਾ (ਕਣਕ)", qty: "5 kg", sel: false },
  { id: 2, cat: "Ration", en: "Basmati Rice", hi: "बासमती चावल", pa: "ਬਾਸਮਤੀ ਚੌਲ", qty: "2 kg", sel: false },
  { id: 3, cat: "Ration", en: "Arhar / Toor Dal", hi: "अरहर दाल", pa: "ਅਰਹਰ ਦਾਲ", qty: "1 kg", sel: false },
  { id: 4, cat: "Ration", en: "Moong Dal", hi: "मूंग दाल", pa: "ਮੂੰਗੀ ਦੀ ਦਾਲ", qty: "500 g", sel: false },
  { id: 5, cat: "Ration", en: "Chana Dal", hi: "चना दाल", pa: "ਛੋਲਿਆਂ ਦੀ ਦਾਲ", qty: "500 g", sel: false },
  { id: 6, cat: "Ration", en: "Sugar (Cheeni)", hi: "चीनी", pa: "ਖੰਡ", qty: "2 kg", sel: false },
  { id: 7, cat: "Ration", en: "Chai Patti", hi: "चाय पत्ती", pa: "ਚਾਹ ਪੱਤੀ", qty: "500 g", sel: false },
  { id: 8, cat: "Ration", en: "Cooking Oil", hi: "खाना पकाने का तेल", pa: "ਖਾਣਾ ਬਣਾਉਣ ਵਾਲਾ ਤੇਲ", qty: "1 L", sel: false },
  { id: 9, cat: "Ration", en: "Desi Ghee", hi: "देसी घी", pa: "ਦੇਸੀ ਘਿਓ", qty: "1 kg", sel: false },
  { id: 10, cat: "Masale", en: "Haldi Powder", hi: "हल्दी पाउडर", pa: "ਹਲਦੀ ਪਾਊਡਰ", qty: "250 g", sel: false },
  { id: 11, cat: "Masale", en: "Lal Mirch Powder", hi: "लाल मिर्च पाउडर", pa: "ਲਾਲ ਮਿਰਚ ਪਾਊਡਰ", qty: "250 g", sel: false },
  { id: 12, cat: "Masale", en: "Dhaniya Powder", hi: "धनिया पाउडर", pa: "ਧਨੀਆ ਪਾਊਡਰ", qty: "250 g", sel: false },
  { id: 13, cat: "Masale", en: "Jeera (Cumin)", hi: "जीरा", pa: "ਜ਼ੀਰਾ", qty: "100 g", sel: false },
  { id: 14, cat: "Masale", en: "Salt (Namak)", hi: "नमक", pa: "ਲੂਣ (ਨਮਕ)", qty: "1 pkt", sel: false },
  { id: 15, cat: "Sabzi", en: "Aloo (Potato)", hi: "आलू", pa: "ਆਲੂ", qty: "2 kg", sel: false },
  { id: 16, cat: "Sabzi", en: "Pyaz (Onion)", hi: "प्याज़", pa: "ਪਿਆਜ਼", qty: "2 kg", sel: false },
  { id: 17, cat: "Sabzi", en: "Tamatar (Tomato)", hi: "टमाटर", pa: "ਟਮਾਟਰ", qty: "1 kg", sel: false },
  { id: 18, cat: "Sabzi", en: "Adrak & Lehsun", hi: "अदरक और लहसुन", pa: "ਅਦਰਕ ਤੇ ਲਸਣ", qty: "250 g", sel: false },
  { id: 19, cat: "Sabzi", en: "Hari Mirch & Dhaniya", hi: "हरी मिर्च धनिया", pa: "ਹਰੀ ਮਿਰਚ ਧਨੀਆ", qty: "100 g", sel: false },
  { id: 20, cat: "Dairy", en: "Milk (Doodh)", hi: "दूध", pa: "ਦੁੱਧ", qty: "1 L", sel: false },
  { id: 21, cat: "Dairy", en: "Dahi (Curd)", hi: "दही", pa: "ਦਹੀਂ", qty: "500 g", sel: false },
  { id: 22, cat: "Dairy", en: "Paneer", hi: "पनीर", pa: "ਪਨੀਰ", qty: "250 g", sel: false },
  { id: 23, cat: "Dairy", en: "Bread / Butter", hi: "ब्रेड / मक्खन", pa: "ਬ੍ਰੈੱਡ / ਮੱਖਣ", qty: "1 pkt", sel: false }
];
var qtys = ["100 g","250 g","500 g","1 kg","2 kg","5 kg","10 kg","500 ml","1 L","1 pkt","2 pkt","1 doz"];
var cats = ["All","Selected","Ration","Masale","Sabzi","Dairy"];
var lang = localStorage.getItem("k_lang") || "en";
var tab = "All";
var items = JSON.parse(localStorage.getItem("k_clean_v1") || "null") || base;

function save() { localStorage.setItem("k_clean_v1", JSON.stringify(items)); render(); }
function setLang(l) { lang = l; localStorage.setItem("k_lang", l); render(); }
function setTab(t) { tab = t; render(); }
function tog(id) { items.forEach(function(i){ if(i.id===id) i.sel=!i.sel; }); save(); }
function chg(id, v) { items.forEach(function(i){ if(i.id===id){ i.qty=v; i.sel=true; } }); save(); }
function del(id) { if(confirm(ui[lang].del)){ items = items.filter(function(i){ return i.id!==id; }); save(); } }
function clearAll() { items.forEach(function(i){ i.sel=false; }); save(); }
function addCustom() {
  var inp = document.getElementById("customItem"), v = inp.value.trim();
  if(!v) return;
  var c = (tab==="All"||tab==="Selected") ? "Ration" : tab;
  items.unshift({ id:Date.now(), cat:c, en:v, hi:v, pa:v, qty:"1 pkt", sel:true });
  inp.value = ""; save();
}
function sendWhatsApp() {
  var p = items.filter(function(i){ return i.sel; }), t = ui[lang];
  if(!p.length) return alert(t.emp);
  var nl = String.fromCharCode(10);
  var msg = t.hdr + nl + nl + p.map(function(x, idx){ return (idx+1)+". "+(x[lang]||x.en)+" — *"+x.qty+"*"; }).join(nl);
  window.location.href = "whatsapp://send?text=" + encodeURIComponent(msg);
}
function render() {
  var t = ui[lang] || ui.en;
  document.getElementById("appTitle").innerText = t.title;
  document.getElementById("appSub").innerText = t.sub;
  document.getElementById("customItem").placeholder = t.ph;
  document.getElementById("addBtn").innerText = t.add;
  document.getElementById("clearBtn").innerText = t.clr;
  document.getElementById("waLabel").innerText = t.wa;
  ["en","hi","pa"].forEach(function(l){ document.getElementById("btn-"+l).className = "lang-btn"+(lang===l?" active":""); });
  document.getElementById("tabs").innerHTML = cats.map(function(c){
